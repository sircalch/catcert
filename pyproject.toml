[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catcert"
version = "1.0.0"
description = "Automated Quality-Control, Vacuum Thickness, Dipole Correction, and Surface Energy Convergence Certification for Heterogeneous Catalysis & DFT Surface Slabs (VASP, Quantum ESPRESSO)"
readme = "README.md"
authors = [
    { name = "Andre Monreal-Hernández", email = "amonreal@example.com" }
]
license = { text = "MIT" }
keywords = [
    "heterogeneous-catalysis",
    "surface-science",
    "dft",
    "vasp",
    "quantum-espresso",
    "surface-energy",
    "vacuum-thickness",
    "work-function",
    "dipole-correction",
    "adsorption-energy",
    "slab-calculations",
    "computational-materials-science",
    "reproducibility"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
    "jinja2>=3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "build>=0.10.0",
    "twine>=4.0.0"
]

[project.scripts]
catcert = "catcert.cli:main"

[project.urls]
Homepage = "https://github.com/sircalch/catcert"
Documentation = "https://github.com/sircalch/catcert#readme"
Repository = "https://github.com/sircalch/catcert.git"
"Bug Tracker" = "https://github.com/sircalch/catcert/issues"
Changelog = "https://github.com/sircalch/catcert/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["catcert*"]


